<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sonic onboarding prototype</title>
<style>
:root{--p:#6C4CF5;--pd:#5636D8;--pl:#F1EDFF;--pll:#F8F6FF;--ink:#1F1B2E;--mut:#55516B;--line:#DAD4EE;--warn:#B86E00;--warnbg:#FFF6E5;--err:#D1344A;--errbg:#FFF0F2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu",sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 50% -10%,#E9E2FF,#fff 65%);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 0 14px}
.pbar{position:sticky;top:0;z-index:100;width:100%;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px;padding:8px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pbar .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px}
.pbar .seg button{padding:5px 11px;border-radius:99px;font-size:12px;color:var(--mut)}
.pbar .seg button.on{background:var(--p);color:#fff}
.pbar select,.pbar .rs{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;font-size:12px;color:var(--ink)}
.frame{position:relative;width:393px;height:852px;flex:none;background:#fff;border-radius:54px;border:9px solid #17142A;box-shadow:0 30px 70px rgba(60,40,140,.22),0 4px 14px rgba(20,10,60,.12);overflow:hidden}
@media(max-width:480px){.sbar{display:none}#app{inset:0}.stage{padding:0}.frame{width:100%;height:calc(100dvh - 46px);border:0;border-radius:0;box-shadow:none;zoom:1!important}}
#app{position:absolute;inset:48px 0 0 0;display:flex;flex-direction:column}
.sbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:15;display:flex;justify-content:space-between;align-items:center;padding:10px 30px 0 34px;background:#fff;font-weight:700;font-size:16px;color:#1F1B2E}
.sbar .isl{position:absolute;left:50%;top:10px;width:104px;height:30px;margin-left:-52px;border-radius:99px;background:#17142A}
.sbar .sic{display:flex;align-items:center;gap:6px}.sbar svg{display:block}
.top{padding:16px 20px 8px;flex:none}
.trow{display:flex;align-items:center;gap:12px}
.bk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pl);border:1.5px solid #C9BDFF;flex:none}
.bk[disabled]{visibility:hidden}
.trk{flex:1;height:6px;display:flex;gap:4px}.trk span{flex:1;background:var(--pl);border-radius:9px;overflow:hidden}
.trk i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#8D70FF);border-radius:9px;transition:width .4s}
.stp{font-size:12.5px;font-weight:600;color:var(--pd);white-space:nowrap;min-width:78px;text-align:right}
.body{flex:1;overflow-y:auto;padding:10px 22px 18px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.r{animation:inR .3s ease}.body.l{animation:inL .3s ease}
@keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.foot{flex:none;height:150px;padding:10px 22px 20px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;background:linear-gradient(#fff0,#fff 28%)}
h1{font-size:26px;line-height:1.18;letter-spacing:-.5px;margin:8px 0 8px;font-weight:750}
h2{font-size:15px;font-weight:700;margin-bottom:8px}
.lead{color:var(--mut);font-size:16.5px;line-height:1.5;margin-bottom:14px}
.sm{font-size:14.5px;color:var(--mut);line-height:1.45}
.btn{width:100%;padding:15px 18px;border-radius:16px;background:var(--p);color:#fff;font-weight:650;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(108,76,245,.28);transition:transform .1s,background .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:#D9D3F0;box-shadow:none;cursor:not-allowed;color:#fff}
.btn.sec{background:var(--pl);color:var(--pd);box-shadow:none;border:1.5px solid #C9BDFF}
.btn.gh{background:none;color:var(--pd);box-shadow:none;padding:10px;font-weight:650;font-size:15.5px}
.foot>.btn:not(.gh):not(.sm2){padding:20px 18px;font-size:19px;border-radius:22px}.foot>.btn.gh{font-size:17px;padding:14px}
.btn.xl{padding:20px 18px;font-size:19px;border-radius:22px}.btn.gh.xl{font-size:17px;padding:14px}
.btn.sm2{width:auto;padding:9px 14px;font-size:14px;border-radius:12px;box-shadow:none}
.lnk{color:var(--pd);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.card.sel{border-color:var(--p);background:var(--pll);box-shadow:0 0 0 3px rgba(108,76,245,.1)}
.card.dis{opacity:.5}
.row{display:flex;gap:12px;align-items:flex-start}
.ico{width:38px;height:38px;border-radius:12px;background:var(--pl);color:var(--p);display:grid;place-items:center;flex:none}
.ico svg,.bk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ct{font-weight:650;font-size:16.5px}
.badge{display:inline-block;font-size:12.5px;font-weight:650;padding:3px 8px;border-radius:99px;background:var(--pl);color:var(--pd);margin-left:6px;vertical-align:1px}
.badge.w{background:var(--warnbg);color:var(--warn)}.badge.g{background:#EEF0F4;color:var(--mut)}
.note{display:flex;gap:10px;padding:13px;border-radius:14px;background:var(--pll);font-size:14.5px;line-height:1.45;color:var(--ink);margin:10px 0}
.note.w{background:var(--warnbg)}.note.e{background:var(--errbg);color:#7B1626}
.note svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px;color:var(--p)}
.note.w svg{color:var(--warn)}.note.e svg{color:var(--err)}
.field{display:flex;gap:8px;margin-bottom:6px}
.field input,.field select,.inp{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;background:#fff;outline:none;transition:border .2s,box-shadow .2s}
.field select{flex:none;width:96px;padding:14px 6px}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(108,76,245,.12)}
.inp.bad,.field.bad input{border-color:var(--err)}
.err{color:var(--err);font-size:14.5px;min-height:18px;margin-bottom:8px}
.lbl{font-size:13px;font-weight:650;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
/* hero */
.hero{position:relative;height:296px;margin:0 0 6px}
.ph{position:absolute;left:50%;top:0;transform:translateX(-50%);width:176px;height:244px;border-radius:30px;border:6px solid #2A2545;background:linear-gradient(#F1ECFF,#fff);overflow:hidden;box-shadow:0 14px 30px rgba(70,40,160,.2)}
.ph:before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:50px;height:12px;background:#2A2545;border-radius:9px}
.phin{padding:34px 12px;text-align:center}.phin b{display:block;font-size:19px;margin-top:2px}.phin span{font-size:11px;color:var(--mut)}
.hc{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:262px;background:var(--p);color:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 14px 30px rgba(108,76,245,.4)}
.hc .h{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.95;margin-bottom:6px}
.hc .t{font-size:14px;line-height:1.35;margin-top:6px}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0,#CFC3FF 28%,#8D70FF 62%,#5636D8);flex:none;position:relative}
.orb.xl{width:84px;height:84px}.orb.lg{width:58px;height:58px}
.orb.b{background:radial-gradient(circle at 30% 30%,#fff 0,#B8C4FF 25%,#4B5BE0 62%,#2A2F8F)}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{display:block;width:3px;border-radius:3px;background:currentColor;opacity:.9;height:6px;animation:wv 1s ease-in-out infinite}
.wave.off i{animation:none;height:5px;opacity:.35}
@keyframes wv{0%,100%{height:5px}50%{height:20px}}
.fc{position:absolute;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:11.5px;font-weight:650;box-shadow:0 6px 16px rgba(60,40,140,.12);animation:fl 4s ease-in-out infinite;white-space:nowrap}
.fc.a{left:-4px;top:4px}.fc.b{right:-6px;top:142px;animation-delay:1s}
.hero .ph{width:244px;height:262px;border-radius:38px;border-width:7px}.hero .ph:before{top:9px;width:70px;height:16px}
.hero .phin{padding:50px 12px}.hero .phin b{font-size:25px;margin-top:4px}.hero .phin span{font-size:13.5px}
.hero .hc{width:326px;border-radius:24px;padding:18px 20px}.hero .hc .h{font-size:14px;gap:10px;margin-bottom:10px}.hero .hc .h .orb{width:34px;height:34px}.hero .hc .wave{height:30px}.hero .hc .t{font-size:17px;margin-top:10px}
.hero.half{height:215px;margin-top:0;overflow:hidden;width:100%}.hero.half .hc{bottom:14px}.hero.half .ph{-webkit-mask-image:linear-gradient(#000 45%,transparent 90%);mask-image:linear-gradient(#000 45%,transparent 90%)}
.hero .fc{padding:9px 15px;font-size:13.5px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* misc */
.uses{list-style:none}.uses li{display:flex;gap:12px;align-items:center;padding:6px 0;font-size:16px;line-height:1.3}
.nums{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.nb{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:10px;font-size:12px;color:var(--mut)}.nb b{display:block;color:var(--ink);font-size:14px;margin-top:2px}.nb.pu{border-color:var(--p);background:var(--pll)}
.arr{color:var(--p);font-size:20px}
.otpb{display:flex;gap:8px;justify-content:center;margin:14px 0 8px}
.otpb input{width:48px;height:58px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:14px;outline:none;padding:0}
.otpb input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(108,76,245,.12)}
.otpb input.f{border-color:var(--p);background:var(--pll)}
.otpb.bad input{border-color:var(--err);animation:shake .4s}
.otpb.ok input{border-color:var(--p);background:var(--pl);color:var(--pd)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spin{width:18px;height:18px;border:2.5px solid var(--pl);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.gmock{position:relative;height:190px;border:5px solid #2A2545;border-radius:24px;background:#F4F3F8;overflow:hidden}
.gf{position:absolute;inset:0;padding:12px;opacity:0;animation:gfr 9s infinite}.gf b{display:block;font-size:15px;margin-bottom:8px}
@keyframes gfr{0%{opacity:0;transform:translateX(16px)}4%{opacity:1;transform:none}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
.gr{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:6px;font-size:14px;position:relative}.gr em{color:#B9B4CC;font-style:normal}
.gr.h{outline:2px solid var(--p);background:var(--pll);font-weight:650}.gr.big{width:100%;text-align:left;font-size:17px;padding:16px 14px;background:#F4F3F8;margin-bottom:8px;border-radius:14px}.gr.big.h{background:var(--pll)}.gr.big .tap{right:36px}
.tap{position:absolute;right:14px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:rgba(108,76,245,.35);animation:tp 1s infinite}
@keyframes tp{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.gtg{width:40px;height:24px;border-radius:99px;background:#D8D3EA;position:relative;animation:gton 9s infinite}.gtg:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;animation:gkn 9s infinite}
.gtg.off{animation:none}.gtg.off:after{animation:none}
@keyframes gton{0%,78%{background:#D8D3EA}82%,100%{background:var(--p)}}@keyframes gkn{0%,78%{transform:none}82%,100%{transform:translateX(16px)}}
.gcap{position:relative;height:26px;margin-top:10px;text-align:center}.gcap span{position:absolute;left:0;right:0;font-weight:650;font-size:14.5px;opacity:0;animation:gc 9s infinite}
@keyframes gc{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
#demo.exit{animation:exUp .38s ease forwards}#demo.enter{animation:enUp .45s ease}
@keyframes exUp{to{opacity:0;transform:translateY(-70px)}}@keyframes enUp{from{opacity:0;transform:translateY(70px)}}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);padding:8px 10px 20px;background:#fff}.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:650;color:var(--mut)}.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--p)}
.ctop{padding:16px 0 6px}.ctop h1{margin:0 0 2px;font-size:28px}
.call{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}.av{width:44px;height:44px;border-radius:50%;background:var(--pl);color:var(--pd);display:grid;place-items:center;font-weight:700;flex:none}
.ctag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--pl);color:var(--pd)}.ctag.s{background:#EEF0F4;color:var(--mut)}.ctag.d{background:var(--warnbg);color:var(--warn)}
.prow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.subh{display:flex;align-items:center;gap:12px;padding:14px 0 4px;font-size:18px}
.card{position:relative}.card>.ck{position:absolute;left:-9px;top:-9px;width:24px;height:24px;border-radius:50%;background:var(--p);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(108,76,245,.4)}.card>.ck svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lrow{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:4px}.lrow .pill{margin-bottom:0}.lrow .pen{margin-left:auto}
.mid{display:flex;flex-direction:column;text-align:center;padding-top:96px}.mid .phl{justify-content:center}.mid .field input{text-align:center;font-size:23px;padding:18px 14px}.mid .field select{text-align:left;font-size:23px;width:124px;padding:18px 8px;font-weight:400}
.lock{background:linear-gradient(160deg,#EEE8FF,#D8CEFF);border-radius:24px;padding:20px 14px 16px;text-align:center;margin:4px 0 12px}.lock .tm{font-size:46px;font-weight:300;color:#3B2F80;line-height:1}.lock{min-height:270px;animation:buzz 6s infinite}.lock .pn{animation:ntf 6s infinite}.lock .pa button:last-child{animation:pb 6s infinite}
@keyframes ntf{0%,6%{transform:translateY(-140%) scale(.96);opacity:0}12%{transform:translateY(8px) scale(1);opacity:1}15%{transform:translateY(-3px)}18%,88%{transform:none;opacity:1}95%,100%{transform:translateY(-24px);opacity:0}}
@keyframes buzz{0%,10%,16%,100%{transform:none}11%{transform:translateX(-3px)}12%{transform:translateX(3px)}13%{transform:translateX(-2px)}14%{transform:translateX(2px)}15%{transform:translateX(-1px)}}
@keyframes pb{0%,38%{box-shadow:0 0 0 0 rgba(108,76,245,0)}48%{box-shadow:0 0 0 7px rgba(108,76,245,.25)}58%,100%{box-shadow:0 0 0 0 rgba(108,76,245,0)}}
.lock .ld{font-size:13px;color:#5B4FA0;margin:4px 0 18px}
.pa{display:flex;gap:8px;margin-top:10px}.pa button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:12px;background:var(--pl);color:var(--pd);font-weight:650;font-size:15px;border:1.5px solid #C9BDFF}.pa svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.phl{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:19px}
.pen{width:34px;height:34px;border-radius:50%;background:var(--pl);color:var(--pd);display:grid;place-items:center;border:1.5px solid #C9BDFF}.pen svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pn{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 10px 24px rgba(60,40,140,.1);margin:10px 0}
.pn .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.pn .h .orb{width:18px;height:18px}.pn b{display:block;font-size:16px}.pn span{font-size:15.5px;color:var(--ink)}
.tg{width:48px;height:28px;border-radius:99px;background:#D8D3EA;position:relative;flex:none;transition:background .2s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tg.on{background:var(--p)}.tg.on:after{transform:translateX(20px)}
.tr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border:0}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--pd);margin:14px 0 8px}
.sec-h i{width:20px;height:20px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid #C9C3DD;flex:none;display:grid;place-items:center;margin-top:1px}
.card.sel .rad{border-color:var(--p)}.card.sel .rad:after{content:"";width:11px;height:11px;border-radius:50%;background:var(--p)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgb{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;position:relative;transition:all .15s}
.lgb b{font-size:20px;width:30px;text-align:center;color:var(--pd)}
.lgb span{font-size:15.5px;font-weight:600}
.lgb.on{border-color:var(--p);background:var(--pll)}
.lgb.on:after{content:"✓";position:absolute;right:10px;top:8px;font-size:12px;color:#fff;background:var(--p);width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.lgb.off{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--pl);color:var(--pd);font-size:14.5px;font-weight:600;margin:0 6px 6px 0}
.pill.no{background:#EEF0F4;color:#45415A;text-decoration:line-through}
.pill.ok2{background:var(--pl)}
.cnt{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;font-size:14.5px;color:var(--mut)}
.cnt b{color:var(--pd);font-size:14px}
.steps{counter-reset:s;list-style:none}
.steps li{display:flex;gap:12px;padding:10px 0;font-size:14.5px;line-height:1.4}
.steps li:before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--pl);color:var(--pd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.steps li small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.acc button{width:100%;text-align:left;padding:13px 14px;font-weight:650;font-size:15.5px;display:flex;justify-content:space-between}
.acc div{display:none;padding:0 14px 12px;font-size:15px;color:var(--mut);line-height:1.5}
.acc.o div{display:block}.acc.o button span{transform:rotate(90deg)}
.num{display:flex;align-items:center;justify-content:space-between;background:var(--pll);border:1.5px dashed var(--p);border-radius:16px;padding:14px;margin:8px 0}
.num b{font-size:21px;letter-spacing:.3px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:#17142A;color:#E9E4FF;border-radius:12px;padding:12px;word-break:break-all;margin:8px 0}
.stepc{border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}

<div class="tabs" id="tb"><button class="on" data-a="tab" data-t="0">Check</button><button data-a="tab" data-t="1">Switch off</button><button data-a="tab" data-t="2">Return</button></div>
<div id="tbc"></div>
${acc("Can't find it?","Search Settings for 'voicemail', check your carrier's app, or ask your carrier to deactivate it.")}
${acc("My carrier won't let me turn it off","Tap \"I couldn't turn it off\" below. You can still continue, but unanswered calls may reach voicemail instead of Sonic. We'll flag it at the end.")}

/* ---------- OTP ---------- */
function otpStart(){UI.otp={d:['','','','','',''],st:'idle',exp:Date.now()+120000,resend:Date.now()+30000,auto:true,sms:false}}
const rsText=()=>{const s=Math.max(0,Math.ceil((UI.otp.resend-Date.now())/1000));return s?`Resend code in 0:${String(s).padStart(2,'0')}`:'Resend code'};
function drawOtp(){const o=UI.otp,box=$('#otp');if(!box)return;
 if(S.otpOk){box.innerHTML=`<div class="otpb ok">${OTP_OK.split('').map(c=>`<input value="${c}" disabled>`).join('')}</div><div class="center"><span class="stat ok">${svg('check').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3"')}Verified (simulated)</span></div>`;return}
 const msg=o.st==='loading'?`<span class="spin"></span>Checking code`:o.st==='error'?`<span style="color:var(--err)">That code isn't right. Try again.</span>`:o.st==='expired'?`<span style="color:var(--err)">This code expired. Request a new one.</span>`:`<span class="sm">Code expires in 2 minutes</span>`;
 box.innerHTML=`<div class="otpb ${o.st==='error'?'bad':''}">${o.d.map((c,i)=>`<input data-o="${i}" inputmode="numeric" maxlength="1" autocomplete="${i?'off':'one-time-code'}" value="${c}" class="${c?'f':''}" ${o.st==='loading'||o.st==='expired'?'disabled':''}>`).join('')}</div>
 <div class="center" style="min-height:22px;font-size:14px">${msg}</div>
 <div class="center" style="margin-top:10px"><button class="lnk" id="rs" data-a="resend" ${o.resend>Date.now()||false?'':''}>${rsText()}</button></div>`;
 $$('[data-o]',box).forEach(inp=>{const i=+inp.dataset.o;
  inp.addEventListener('input',()=>{o.auto=false;const v=inp.value.replace(/\D/g,'');if(v.length>1){v.slice(0,6).split('').forEach((c,k)=>o.d[k]=c);drawOtp();checkOtp();return}o.d[i]=v;inp.value=v;inp.classList.toggle('f',!!v);if(v&&i<5)$(`[data-o="${i+1}"]`,box).focus();checkOtp()});
  inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0){o.d[i-1]='';const p=$(`[data-o="${i-1}"]`,box);p.value='';p.classList.remove('f');p.focus()}});
  inp.addEventListener('focus',()=>{if(o.st==='error'){o.st='idle';o.d=['','','','','',''];drawOtp();$('[data-o="0"]').focus()}})});
}
function checkOtp(){const o=UI.otp;if(o.d.every(Boolean)&&o.st!=='loading'){o.st='loading';drawOtp();later(()=>{if(Date.now()>o.exp){o.st='expired';drawOtp();return}
 if(o.d.join('')===OTP_OK){S.otpOk=true;S.verifiedFor=S.cc+S.phone;save();drawOtp();const b=$('#foot .btn');if(b)b.disabled=false;$('#smsb').innerHTML=''}else{o.st='error';drawOtp()}},900)}}
function schedAuto(){const o=UI.otp;o.auto=true;later(()=>{if(!o.auto||S.otpOk)return;$('#smsb').innerHTML=`<div class="sms"><small>MESSAGES · now (simulated)</small>${OTP_OK} is your Sonic verification code.</div>`;
 let i=0;const t=every(()=>{if(!o.auto){clearInterval(t);return}o.d[i]=OTP_OK[i];i++;drawOtp();if(i>=6){clearInterval(t);checkOtp()}},220)},1800)}

/* ---------- voice preview ---------- */
function pickVoice(vid,lang){let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}const pre=LTAG[lang].slice(0,2).toLowerCase();let c=vs.filter(x=>x.lang.replace('_','-').toLowerCase().startsWith(pre));if(!c.length)return null;c.sort((a,b)=>(b.lang.toLowerCase().includes('-in')?1:0)-(a.lang.toLowerCase().includes('-in')?1:0));return c.find(x=>VOICES[vid].pref.test(x.name))||c[0]}
function speakAs(vid,lang,text,onEnd,onFail){
 if(!('speechSynthesis' in window)){onFail&&onFail('This browser has no speech support.');return}
 const go_=(retry)=>{const v=pickVoice(vid,lang);if(!v){if(retry){later(()=>go_(false),400);return}onFail&&onFail(`No ${LN[lang]} voice is installed on this device.`);return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.pitch=VOICES[vid].pitch;u.rate=VOICES[vid].rate;u.onend=()=>onEnd&&onEnd();u.onerror=()=>onEnd&&onEnd();speechSynthesis.speak(u)};go_(true)}
function drawPv(){const el=$('#pv');if(!el)return;
 el.innerHTML=Object.values(VOICES).map(v=>{const sup=v.sup.includes(S.pvLang),pl=UI.pv.playing===v.id;
  const on=S.voice===v.id;
  return `<div class="card ${on?'sel':''}" data-a="pickV" data-k="${v.id}" style="cursor:pointer">${on?`<span class="ck">${svg('check')}</span>`:''}<div class="vc"><span class="orb lg ${v.cls}" style="${on?'':'opacity:.5;filter:saturate(.5)'}"></span><div style="flex:1"><div class="ct">${v.name}<span class="badge">${v.tag}</span></div><div class="sm" style="margin-top:2px">${v.desc}</div>
  ${pl?`<div class="wave" style="color:var(--p);margin-top:8px;width:90px">${Array.from({length:14},(_,i)=>`<i style="animation-delay:${(i*.08).toFixed(2)}s"></i>`).join('')}</div>`:''}
  ${!sup?`<div class="sm" style="margin-top:4px">Not available in ${LN[S.pvLang]}</div>`:pl&&UI.pv.sim?`<div class="sm" style="margin-top:4px">Silent simulated preview</div>`:''}</div>
  <button class="pl2" data-a="play" data-k="${v.id}" aria-label="${pl?'Stop':'Play'} ${v.name}" ${sup?'':'disabled style="opacity:.4"'}>${svg(pl?'pause':'play')}</button></div></div>`}).join('')+(UI.pv.note?`<div class="note w">${svg('alert')}<span>${esc(UI.pv.note)}</span></div>`:'')}
function stopPv(){clearTimeout(UI.pv.simT);try{speechSynthesis.cancel()}catch(e){}UI.pv.playing=null;UI.pv.sim=false}
function playPv(id){if(UI.pv.playing===id){stopPv();drawPv();return}stopPv();UI.pv.playing=id;UI.pv.note='';UI.pv.sim=false;S.voice=S.voice||id;drawPv();
 const fin=()=>{if(UI.pv.playing===id){UI.pv.playing=null;UI.pv.sim=false;drawPv()}};
 speakAs(id,S.pvLang,PHRASE[S.pvLang],fin,(why)=>{UI.pv.note=why+' This preview is a silent animation, not real audio.';UI.pv.sim=true;drawPv();UI.pv.simT=setTimeout(fin,3500)})}

const DLG={notif:{ios:['"Sonic" Would Like to Send You Notifications','Notifications may include alerts, sounds and icon badges.','Allow',"Don't Allow"],android:['Allow Sonic to send you notifications?','','Allow',"Don't allow"]},
 contacts:{ios:['"Sonic" Would Like to Access Your Contacts','Sonic uses your contacts to recognise friends and family when they call.','OK',"Don't Allow"],android:['Allow Sonic to access contacts?','Sonic will use your contacts to recognise known callers.','Allow',"Don't allow"]},
 role:{ios:['Turn on unknown number detection','In Settings, switch on Sonic under Call Blocking and Identification. The path can differ by iOS version.',"I've turned it on",'Not now'],android:['Turn on unknown number detection?','Set Sonic as your caller ID and spam app so it can spot unknown numbers.','Turn on','Not now']}};
function dialog(kind,cb){const [t,p,ok,no]=DLG[kind][S.platform];

 <div class="db"><button data-d="1">${esc(ok)}</button><button data-d="0">${esc(no)}</button></div><div class="sim">Simulated system dialog</div></div></div>`;

function guide(cb){const row=(t,h)=>`<div class="gr ${h?'h':''}"><span>${t}</span>${h?'<i class="tap"></i>':'<em>›</em>'}</div>`;
 $('#ov').innerHTML=`<div class="sheetbg"></div><div class="sheet"><h2 style="font-size:19px;margin-bottom:10px">Turn on unknown number detection</h2>
 <div class="gmock">
  <div class="gf" style="animation-delay:0s"><b>Settings</b>${row('Notifications')}${row('Phone',1)}${row('Messages')}</div>
  <div class="gf" style="animation-delay:3s"><b>Phone</b>${row('Announce Calls')}${row('Call Blocking and Identification',1)}${row('Silence Unknown Callers')}</div>
  <div class="gf" style="animation-delay:6s"><b>Call Blocking</b><div class="gr h"><span>Sonic</span><div class="gtg"></div></div><div class="gr"><span>Another app</span><div class="gtg off"></div></div></div>
 </div>
 <div class="gcap"><span style="animation-delay:0s">1. Open Settings, then Phone</span><span style="animation-delay:3s">2. Tap Call Blocking and Identification</span><span style="animation-delay:6s">3. Switch Sonic on</span></div>

function openDialer(){UI.dial={val:'',st:'idle',res:null,menu:true};drawDialer()}
function drawDialer(){const d=UI.dial;const keys=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
 $('#ov').innerHTML=`<div class="dial"><div class="dh"><span class="tag">Simulated dialer</span><button class="lnk" data-a="closeDial">Return to Sonic</button></div>
 <div class="disp" id="dd" data-a="showPaste">${d.menu?'<button class="pmenu" data-a="paste">Paste</button>':''}${d.val?esc(d.val):'<span style="color:#9A96AE;font-weight:400;font-size:18px">Tap to paste or type the code</span>'}</div>
 <div style="min-height:20px"></div>
 <div class="kp">${keys.map(([k,s])=>`<button data-k="${k}">${k}<small>${s}</small></button>`).join('')}</div>
 <div class="acts"><span style="width:64px"></span><button class="callb ${d.val?'pulse':''}" data-a="dialGo" aria-label="Call">${svg('phone')}</button><button class="rb" data-a="dialDel" aria-label="Delete" style="width:64px;background:none;color:var(--mut);font-size:22px">⌫</button></div>
 <div class="sim-t" style="padding-bottom:10px">This is a practice dialer. Your phone isn't called.</div>
 ${d.st==='calling'?`<div class="scrim"><div class="dlg ios"><div class="dt"><h3><span class="spin"></span>Dialing</h3><p>Sending code to the carrier (simulated)</p></div></div></div>`:''}
 ${d.st==='result'?`<div class="scrim"><div class="dlg ${S.platform}"><div class="dt"><h3>${esc(d.res.t)}</h3><p>${esc(d.res.p)}</p></div><div class="db"><button data-a="dialOk">OK</button></div><div class="sim">Simulated carrier message</div></div></div>`:''}</div>`}
function dialGo(){const d=UI.dial,v=d.val.replace(/\s/g,'');if(!v)return;d.st='calling';drawDialer();
 later(()=>{const ds=dialStr(),alt=ds.replace('+91','91'),alt2=ds.replace('+91','');
  if([ds,alt,alt2].includes(v)){S.dialed='ok';S.fwdConfirmed=true;S.fwdVerified=false;d.res={t:'Setting activated',p:'Forwarding to '+SONIC_NUM+' (simulated message).',ok:1}}
  else{S.dialed='error';d.res={t:'Connection problem or invalid MMI code',p:'The code was not accepted. Check it and try again.',ok:0}}
  d.st='result';save();drawDialer();if(d.res.ok)later(()=>A.dialOk(),1500)},1200)}

const STARTERS=["What if my family calls and it's urgent?","What happens when a delivery partner cannot find my house?","Will Sonic share my personal information?","How does Sonic handle spam calls?"];
const KB=[

function reply(q){const s=q.toLowerCase();for(const k of KB)if(k[0].test(s))return{r:k[2],id:k[1],a:k[3],b:k[4]};return{r:'Good question. I\'d ask the caller what they need, keep your details private, and send you a short summary. Try one of the examples below if you like.',id:'gen',a:'how Sonic would handle a call',b:'what Sonic does by default'}}
function ask(q){q=q.trim();if(!q)return;const D=UI.demo;D.msgs.push({u:1,t:q});D.typing=true;D.ended=false;drawDemo();
 later(()=>{const r=reply(q);D.typing=false;D.msgs.push({t:r.r,act:r.id==='delivery'});D.topics.push(r);if(D.voice)speakAs(S.voice||'ira','en',r.r);drawDemo()},800)}

  f.innerHTML='';return}
 const secs=Math.floor((Date.now()-D.t0)/1000);
 el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="row" style="align-items:center"><span class="orb"></span><div><div class="ct">Sonic</div><div class="sm">${D.ended?'Call ended':'On a simulated call'}</div></div></div>

 <div class="msgs" id="msgs">${D.msgs.map(m=>`<div class="m ${m.u?'u':'s'}">${esc(m.t)}${m.act&&!S.addr.home?`<div style="margin-top:8px"><button class="btn sm2" data-a="addr">Add my address</button></div>`:''}${m.act&&S.addr.home?'<div class="sm" style="margin-top:6px">Address saved.</div>':''}</div>`).join('')}${D.typing?'<div class="m s typing"><i></i><i></i><i></i></div>':''}</div>
 ${D.ended?`<div class="card" style="border-color:var(--p);background:var(--pll)"><div class="ct">Call summary sent</div><p class="sm" style="margin-top:4px">${esc(summaryText())}</p></div>`:''}
 <div class="chips">${STARTERS.filter(s=>!D.msgs.some(m=>m.t===s)).map(s=>`<button class="chip" data-a="starter" data-t="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
 if(D.ended){f.innerHTML=btn('Finish onboarding','next')+`<div style="display:flex;gap:8px"><button class="btn gh" style="flex:1" data-a="demoMore">Try another question</button><button class="btn gh" style="flex:1" data-a="demoReset">Restart demo</button></div>`}
 else f.innerHTML=`<div class="chat-in"><input class="inp" id="dq" placeholder="Type a concern or question" maxlength="140"><button class="rb" data-a="mic" aria-label="Speak">${svg('mic')}</button><button class="rb pr" data-a="dsend" aria-label="Send">${svg('send')}</button></div><button class="btn gh" data-a="next" style="margin-top:8px;font-size:18px;padding:12px">Continue</button>`;
 const m=$('#body');if(m)m.scrollTop=m.scrollHeight;const q=$('#dq');if(q&&D.msgs.length>1&&!D.typing)q.focus()}

 voice:(el)=>{S.voice=el.dataset.k;S.voiceOk=false;soft()},
 vNext:()=>{if(!S.voice){toast('Choose a voice first');return}go(S.step+1)},
 pvLang:(el)=>{stopPv();S.pvLang=el.dataset.k;soft()},pickV:(el)=>{if(S.voice!==el.dataset.k){S.voice=el.dataset.k;S.voiceOk=!!S.home;drawPv()}},
 play:(el,ev)=>{ev.stopPropagation();playPv(el.dataset.k)},
 pvOk:()=>{if(!S.voice){toast('Tap a voice to select it');return}S.voiceOk=true;go(S.step+1)},
 vmDone:()=>{S.vm='done';go(S.step+1)},vmSkip:()=>{S.vm='skipped';go(S.step+1)},
 acc:(el)=>el.parentElement.classList.toggle('o'),
 how2:()=>sheet(`<h2 style="font-size:19px">Show me how</h2><div class="tabs" id="tb"><button class="on" data-a="tab" data-t="0">Check</button><button data-a="tab" data-t="1">Switch off</button><button data-a="tab" data-t="2">Return</button></div><div id="tbc"></div>`) || A.tab({dataset:{t:0}}),
 tab:(el)=>{const t=+el.dataset.t;$$('#tb button').forEach((b,i)=>b.classList.toggle('on',i===t));
  const c=[`<div class="mini"><b style="font-size:15px">Voicemail</b><div class="r h"><span>Greeting</span><span>Set Up Now</span></div><div class="r"><span>Messages</span><span>0</span></div><p class="sm" style="margin-top:10px">Open the Phone app, tap Voicemail, and see if it is active.</p></div>`,
   `<div class="mini"><b style="font-size:15px">Carrier services</b><div class="r"><span>Call forwarding</span><span>›</span></div><div class="r h"><span>Voicemail</span><span>On ›</span></div><div class="r"><span>Call waiting</span><span>On</span></div><p class="sm" style="margin-top:10px">Find voicemail in Settings or your carrier's app, or ask your carrier.</p></div>`,
   `<div class="mini"><div class="center"><span class="orb lg" style="display:inline-block"></span><div class="ct" style="margin-top:8px">Back in Sonic</div><div class="sm">Tap Done, continue</div></div></div>`][t];$('#tbc').innerHTML=c},
 copyNum:async()=>{const ok=await copyText(SONIC_NUM);UI.clip=SONIC_RAW;UI.c1=true;toast(ok?'Number copied':'Copy blocked. Press and hold the number to copy');soft()},
 copyCode:async()=>{const ok=await copyText(dialStr());UI.clip=dialStr();UI.c1=true;toast(ok?'Code copied':'Copy blocked. Select the code to copy');soft();if(S.dialed!=='ok')later(()=>openDialer(),900)},
 saveCode:()=>{const v=$('#ce').value.trim();if(v&&!/^[*#0-9]+\*?$/.test(v)){toast('Use only digits, * and #');return}S.codeOverride=v;S.dialed=null;$('#ov').innerHTML='';soft()},
 openDial:()=>openDialer(),closeDial:()=>{$('#ov').innerHTML='';soft()},
 showPaste:()=>{UI.dial.menu=!UI.dial.menu;drawDialer()},
 paste:(el,ev)=>{ev&&ev.stopPropagation();UI.dial.menu=false;if(!UI.clip){toast('Clipboard is empty. Copy the code first');drawDialer();return}UI.dial.val+=UI.clip;drawDialer()},
 dialDel:()=>{UI.dial.val=UI.dial.val.slice(0,-1);drawDialer()},dialGo:()=>dialGo(),
 dialOk:()=>{const ok=UI.dial.res.ok;UI.dial.st='idle';$('#ov').innerHTML='';soft();if(ok)toast('Back in Sonic')},
 fwdDone:()=>{S.fwdConfirmed=true;S.fwdSkipped=false;soft()},
 fwdSkip:()=>{S.fwdSkipped=true;go(S.step+1)},
 retry:()=>{S.dialed=null;S.fwdConfirmed=false;S.fwdVerified=false;UI.c1=false;render();$('#body').scrollTop=0},
 help:()=>sheet(`<h2 style="font-size:19px">Need help?</h2>${acc('Dialer says "invalid code"','Check you pasted the whole code. Some carriers use a different one, see below.')}${acc('Nothing happened','Wait a few seconds for the carrier message. Check your signal and try again.')}${acc('My carrier uses a different code',`<input class="inp" id="ce" style="font-size:15px;margin:6px 0" placeholder="Prefix, e.g. **21*" value="${esc(S.codeOverride)}"><button class="btn sec sm2" data-a="saveCode">Save</button>`)}${acc('Turn forwarding off','On most phones, dial ##002# to cancel all forwarding.')}`),
 testCall:()=>{$('#tc').innerHTML=`<div><span class="spin"></span>Sonic is calling your number (simulated)</div>`;const b=$('#foot .btn');if(b)b.disabled=true;
  later(()=>{if(S.dialed==='ok'){S.fwdConfirmed=true;S.fwdVerified=true;$('#tc').innerHTML='<span class="stat ok">Verified (simulated)</span>';later(()=>go(S.step+1),900)}else{$('#tc').innerHTML=`<div class="note e" style="margin:0">${svg('alert')}<span>Test call didn't come through. Dial the code in the dialer, then try again.</span></div>`;const b2=$('#foot .btn');if(b2)b2.disabled=false}},2200)},
 demoStart:()=>{const D=UI.demo,el=$('#demo');if(D.on||!el)return;el.className='exit';
  later(()=>{D.on=true;D.ended=false;D.msgs=[{t:`Hi ${S.name?S.name.split(' ')[0]:'there'}, I'm Sonic, your AI assistant. What would you like to ask?`}];D.t0=Date.now();D.topics=[];drawDemo();el.className='enter'},380)},
 starter:(el)=>ask(el.dataset.t),dsend:()=>{const i=$('#dq');if(!i.value.trim()){toast('Type something first');return}const v=i.value;i.value='';ask(v)},
 demoEnd:()=>{const D=UI.demo;if(!D.topics.length){toast('Ask Sonic something first');return}D.ended=true;S.demoDone=true;save();drawDemo();pushNotif()},
 demoMore:()=>{UI.demo.ended=false;$('#push').innerHTML='';drawDemo()},demoReset:()=>{Object.assign(UI.demo,{on:false,msgs:[],ended:false,topics:[]});$('#push').innerHTML='';drawDemo();later(()=>A.demoStart(),1500)},
 demoVoice:()=>{UI.demo.voice=!UI.demo.voice;try{speechSynthesis.cancel()}catch(e){}toast(UI.demo.voice?'Sonic will speak replies if your device has a voice':'Voice replies off');drawDemo()},
 mic:()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("Mic input isn't supported here. Type instead.");return}try{const r=new R();r.lang='en-IN';r.onresult=e=>{const t=e.results[0][0].transcript;ask(t)};r.onerror=()=>toast("Couldn't use the mic here. Type instead.");r.start();toast('Listening...')}catch(e){toast("Couldn't use the mic here. Type instead.")}},
 addr:()=>sheet(`<h2 style="font-size:19px">Add delivery spots</h2><p class="sm" style="margin-bottom:8px">Sonic shares these only with delivery partners.</p>
  <div class="lbl">Home address</div><input class="inp" style="font-size:15px" data-i="addr" data-f="home" placeholder="Flat, building, area" value="${esc(S.addr.home)}">
  <div class="lbl">Home drop instruction</div><input class="inp" style="font-size:15px" data-i="addr" data-f="homeNote" placeholder="e.g. Hand it to my mother" value="${esc(S.addr.homeNote)}">
  <div class="lbl">Office address</div><input class="inp" style="font-size:15px" data-i="addr" data-f="office" placeholder="Building, floor, area" value="${esc(S.addr.office)}">
  <div class="lbl">Office drop instruction</div><input class="inp" style="font-size:15px" data-i="addr" data-f="officeNote" placeholder="e.g. Leave with security" value="${esc(S.addr.officeNote)}">
  <button class="btn" style="margin-top:14px" data-a="addrSave">Save</button>`),
 addrSave:()=>{$('#ov').innerHTML='';save();drawDemo();toast('Saved. Sonic can use this for deliveries')},
 goto:(el)=>go(+el.dataset.s),fixFirst:()=>{const r=status();if(r.length)go(r[0].step)},

 openHome:()=>{S.home=true;S.aiOn=true;S.incomplete=false;UI.home={tab:'chats',page:null,chat:null,f:'All',hs:'idle'};render()},
 skipHome:()=>{S.home=true;S.aiOn=false;S.incomplete=true;UI.home={tab:'profile',page:null,chat:null,f:'All',hs:'idle'};render()},
 hTab:(el)=>{UI.home.tab=el.dataset.k;UI.home.page=null;UI.home.chat=null;render()},
 hOpen:(el)=>{UI.home.page=el.dataset.k;if(el.dataset.k==='health')UI.home.hs='idle';render()},
 hBack:()=>{stopPv();if(UI.home.chat)UI.home.chat=null;else UI.home.page=null;render()},
 hChat:(el)=>{UI.home.chat=+el.dataset.k;render()},hFilter:(el)=>{UI.home.f=el.dataset.k;soft()},
 hTog:(el)=>{const k=el.dataset.k;S[k]=!S[k];if(k==='aiOn')toast(S.aiOn?'Sonic is on':'Sonic is off. Calls ring as usual');soft()},
 hFix:(el)=>{go(+el.dataset.s)},
 runHealth:()=>{UI.home.hs='running';render();later(()=>{UI.home.hs='done';render()},1400)},
 insAdd:(el)=>{S.instr=(S.instr?S.instr+'\n':'')+el.dataset.t+'.';soft()},insSave:()=>{save();toast('Instructions saved')},aboutSave:()=>{save();toast('Saved')},
 dlData:()=>toast('Data request sent (simulated)'),support:()=>toast('Support chat opens here (simulated)'),
 delAcc:()=>sheet(`<h2 style="font-size:19px">Delete account?</h2><p class="sm" style="margin:6px 0 12px">This resets the prototype to the start.</p><button class="btn" data-a="restartAll">Delete account</button>`),
 restartAll:()=>{S=DEF();UI.home={tab:'chats',page:null,chat:null,f:'All',hs:'idle'};$('#ov').innerHTML='';UI.otp=null;UI.c1=false;UI.demo={on:false,msgs:[],ended:false,typing:false,voice:false,t0:0,topics:[]};go(0)}
};
const H={cc:el=>{S.cc=el.value;save()},phone:el=>{let d=el.value.replace(/\D/g,'');d=d.slice(0,S.cc==='+91'?10:12);S.phone=d;el.value=fmtPhone();$('#perr').textContent='';$('#pf').classList.remove('bad')},
 name:el=>{S.name=el.value;$('#nerr').textContent='';el.classList.remove('bad');$('#nprev').textContent=`Hi ${S.name.trim()?S.name.trim().split(' ')[0]:'there'}, I'm Sonic, your AI assistant.`},
 addr:el=>{S.addr[el.dataset.f]=el.value},name2:el=>{S.name=el.value},instr:el=>{S.instr=el.value}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){if(t.tagName==='A')return;A[t.dataset.a](t,e)}else{const k=e.target.closest('.kp [data-k]');if(k){UI.dial.val+=k.dataset.k;drawDialer()}}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-i]');if(t&&H[t.dataset.i])H[t.dataset.i](t)});
document.addEventListener('change',e=>{if(e.target.id==='cc')H.cc(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dq')A.dsend();if(e.key==='Enter'&&e.target.id==='ph')A.phoneNext();if(e.key==='Enter'&&e.target.id==='nm')A.nameNext()});
$('#jump').innerHTML=STEPS.map((s,i)=>`<option value="${i}">${i+1}. ${s.t}</option>`).join('')+'<option value="home">Home (after setup)</option>';
$('#jump').onchange=e=>{e.target.value==='home'?A.openHome():go(+e.target.value)};
$('#plat').onclick=e=>{const b=e.target.closest('button');if(b){S.platform=b.dataset.p;if(STEPS[S.step].iosOnly&&!ios())go(S.step+1);else render()}};
$('#restart').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}A.restartAll()};
S.step=Math.min(S.step,TOTAL-1);if(STEPS[S.step].iosOnly&&!ios())S.step++;if(S.finished!==undefined)delete S.finished;fit();render();
</script>
</body>
</html>
